<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Video player stand-in</title>
  <style>
    html { color-scheme: dark; }
    body { display: grid; place-items: center; min-block-size: 100dvh; margin: 0; background: linear-gradient(135deg, #1e1b3a, #3d5a80); color: #fff; font: 1rem/1.5 system-ui, sans-serif; text-align: center; }
    h1 { margin: 0 0 0.25rem; font-size: 1.25rem; }
    p { margin: 0; opacity: 0.85; }
  </style>
</head>
<body>
  <main>
    <h1>The video plays here</h1>
    <p>This page stands in for a YouTube or Vimeo player, so the demo makes no request to another site.</p>
  </main>
</body>
</html>
