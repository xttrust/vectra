<article class="v-card">
  <header class="v-card-header">
    <h2 class="v-card-title">Invite your team</h2>
    <span class="v-badge v-badge-success v-badge-dot">3 seats left</span>
  </header>
  <div class="v-field">
    <label class="v-label" for="email">Work email</label>
    <input class="v-input" id="email" type="email" value="aoife@acme.ie">
  </div>
  <fieldset class="v-segmented">
    <legend class="v-sr-only">Role</legend>
    <label><input type="radio" name="role" value="viewer"><span>Viewer</span></label>
    <label><input type="radio" name="role" value="editor" checked><span>Editor</span></label>
  </fieldset>
  <div class="v-alert v-alert-info"><svg class="v-icon" aria-hidden="true"><use href="/icons/sprite.svg#info"/></svg><p class="v-alert-body">Editors can publish pages.</p></div>
  <footer class="v-card-footer">
    <button class="v-btn v-btn-primary" type="button">Send invite</button>
    <button class="v-btn v-btn-ghost" type="button">Cancel</button>
  </footer>
</article>
