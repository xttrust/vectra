name: Update visual baselines

# Run manually on a branch after an intended visual change. Regenerates the screenshots
# in the same pinned image the CI visual job uses and commits them to that branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Regenerate baselines in the pinned Playwright image
        run: |
          docker run --rm --ipc=host -u "$(id -u):$(id -g)" -e HOME=/tmp -e CI=1 \
            -v "$PWD":/work -w /work mcr.microsoft.com/playwright:v1.64.1-noble \
            npx playwright test --project=chromium --grep @visual --update-snapshots
      - name: Commit changed baselines
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/__screenshots__
          if git diff --cached --quiet; then echo "Baselines unchanged."; exit 0; fi
          git commit -m "test: update visual baselines"
          git push
